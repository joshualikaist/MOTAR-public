<text x="55" y="824" font-size="22" font-weight="400" text-anchor="start" fill="#52606d">D7 times a read-only shadow query beside production; its debug output is not detector input.</text>
<text x="55" y="859" font-size="22" font-weight="400" text-anchor="start" fill="#52606d">D6 INCONCLUSIVE; D7 GO is cost/non-interference only; shortcut reduction is unmeasured.</text>
