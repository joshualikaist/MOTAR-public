<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Appearance and dynamic-mesh research paths</title><desc id="desc">Production analytic sensing is distinct from the independent geometry-to-appearance research path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#253341"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Arial, Noto Sans CJK KR, sans-serif" fill="#16232f">
<text x="55" y="68" font-size="35" font-weight="700" text-anchor="start" fill="#253341">Appearance and dynamic-mesh research paths</text>
<g data-block="true">
<rect x="110" y="140" width="430" height="115" rx="3" fill="#f2f2ed" stroke="#253341" stroke-width="2"/>
<text x="325.0" y="183" font-size="27" font-weight="700" text-anchor="middle" fill="#253341">Analytic proxy</text>
<text x="325.0" y="223" font-size="23" font-weight="400" text-anchor="middle" fill="#253341">Existing detector input</text>
</g>
<g data-block="true">
