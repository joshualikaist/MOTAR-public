<text x="1275.0" y="223" font-size="23" font-weight="400" text-anchor="middle" fill="#253341">Observation unchanged</text>
</g>
<path d="M540 198 L1060 198" fill="none" stroke="#253341" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-block="true">
