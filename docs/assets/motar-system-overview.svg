<text x="1092" y="460" font-size="22" fill="#526775" font-weight="400" text-anchor="start">자세 효과의 원인 분해는 보류</text>
<rect x="52" y="572" width="1496" height="189" rx="20" fill="#e4f1ee" stroke="#dce5ea"/>
<text x="80" y="617" font-size="29" fill="#007f73" font-weight="700" text-anchor="start">완료된 측정과 남은 전제조건을 구분합니다</text>
<text x="80" y="665" font-size="24" fill="#526775" font-weight="400" text-anchor="start">기존 색 detector + 단일 KF는 알려진 실패 기준선이며, 새 인지 경로의 대표 그림이 아닙니다.</text>
<text x="80" y="712" font-size="24" fill="#526775" font-weight="400" text-anchor="start">각 축의 결과는 연결되어 있지만, 하나의 실기 end-to-end 성능으로 합산하지 않습니다.</text>
<path d="M52 804H1548" stroke="#cbd8df"/>
<text x="52" y="839" font-size="20" fill="#a55316" font-weight="400" text-anchor="start">공통 한계: 실기 미조립 · 자체 센서 로그 없음 · 실제 비행 성능 및 sim-to-real 전이 미입증</text>
<text x="52" y="875" font-size="16" fill="#526775" font-weight="400" text-anchor="start">근거: README.md / Track A·B·C 상태표 및 연결된 결과 보고서</text>
</g></svg>
