<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">정책과 고정 제어기</title><desc id="desc">기존 구조도와 최신 해석 범위를 함께 읽는 발표용 요약</desc><rect width="1600" height="900" fill="#f4f7fa"/><g font-family="Arial, Noto Sans CJK KR, sans-serif">
<text x="52" y="48" font-size="17" fill="#007f73" font-weight="700" text-anchor="start">MOTAR / RESEARCH EVIDENCE</text>
<text x="1548" y="48" font-size="16" fill="#526775" font-weight="700" text-anchor="end">2026-09-10 · SIMULATION</text>
<text x="52" y="108" font-size="39" fill="#142d3b" font-weight="700" text-anchor="start">정책과 고정 제어기</text>
<text x="52" y="153" font-size="22" fill="#526775" font-weight="400" text-anchor="start">기존 구조도와 최신 해석 범위를 함께 읽는 발표용 요약</text>
<svg x="52" y="185" xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 1440 1160" role="img" aria-labelledby="context-title context-desc"><title id="context-title">SIMULATION / 구현 계약 · 2026-09-10</title><desc id="context-desc">학습 정책과 고정 제어기를 구분한 그림입니다. P10은 시뮬레이터 평가 결과입니다. 실제 비행 및 전이 성능은 미검증입니다.</desc>
<!-- ORIGINAL_PANEL_START -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="panel-title panel-desc">
<title id="panel-title">Policy action → force &amp; torque → motor dynamics</title><desc id="panel-desc">학습하는 항법 정책과 고정된 비행 제어기 · corrected-v2 canonical 실행 계약</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8395A1"/></marker></defs>
<g font-family="Arial, 'Noto Sans CJK KR', sans-serif">
<rect width="1440" height="1010" rx="24" fill="#F4F7FA"/>
<path d="M24 1H1416" stroke="#DCE5EA"/>

<text x="40" y="38" font-size="13" font-weight="700" fill="#007F73" text-anchor="start">MOTAR   /   04 / CONTROL</text>
<text x="1400" y="38" font-size="12" font-weight="700" fill="#536B7A" text-anchor="end">10 Hz POLICY / 100 Hz PHYSICS</text>
<text x="40" y="86" font-size="32" font-weight="700" fill="#142D3B" text-anchor="start">Policy action → force &amp; torque → motor dynamics</text>
<text x="40" y="119" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">학습하는 항법 정책과 고정된 비행 제어기 · corrected-v2 canonical 실행 계약</text>
<rect x="40" y="162" width="316" height="310" rx="16" fill="#E8F1EF" stroke="#DCE5EA"/>
<rect x="60" y="186" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="76" y="202" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">01  LEARNED POLICY</text>
<text x="62" y="239" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Transformer actor</text>
<text x="62" y="274" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Squashed Gaussian action</text>
<text x="62" y="303" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">a = [aₓ, aᵧ, a_z, aψ]</text>
<text x="62" y="332" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">aᵢ ∈ [−1, 1]</text>
<text x="62" y="361" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">a_z is observed, not executed</text>
<path d="M361 317L378 317" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="388" y="162" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="408" y="186" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="424" y="202" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">02  COMMAND MAPPING</text>
<text x="410" y="239" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Body-frame setpoints</text>
<text x="410" y="274" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">v*xy = 2.5 · [aₓ, aᵧ]</text>
<text x="410" y="303" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">ω*ψ = 3.0 · aψ</text>
<text x="410" y="332" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Per-axis clamp · m/s, rad/s</text>
<text x="410" y="361" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Baseline governor: OFF</text>
<path d="M709 317L726 317" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="736" y="162" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="756" y="186" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="772" y="202" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">03  ALTITUDE SUPERVISOR</text>
<text x="758" y="239" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Independent PI hold</text>
<text x="758" y="274" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">e_z = 1.0 m − z</text>
<text x="758" y="303" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">I_z ← clip(I_z + e_zΔt, ±2.5)</text>
<text x="758" y="332" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">v*z = clip(4e_z + I_z, ±2.5)</text>
<text x="758" y="361" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Overwrites the policy z channel</text>
<path d="M1057 317L1074 317" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1084" y="162" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="1104" y="186" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="1120" y="202" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">04  VELOCITY LOOP</text>
<text x="1106" y="239" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Lee velocity control</text>
<text x="1106" y="274" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">e_v = R_yaw v* − v_world</text>
<text x="1106" y="303" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">a* = K_v e_v</text>
<text x="1106" y="332" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">K_v = [2.5, 2.5, 2.5]</text>
<text x="1106" y="361" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">f* = m(a* − g)</text>
<text x="1106" y="390" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Position term = 0 in velocity mode</text>
<rect x="1084" y="540" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="1104" y="564" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="1120" y="580" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">05  FORCE → ATTITUDE</text>
<text x="1106" y="617" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Tilt-limited orientation</text>
<text x="1106" y="652" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">‖f*xy‖ ≤ f*z tan(45°)</text>
<text x="1106" y="681" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">b*₃ = f* / ‖f*‖ → R*</text>
<text x="1106" y="710" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">T = f*z / b₃z if b₃z &gt; 0.5</text>
<text x="1106" y="739" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Otherwise: T = f* · b₃</text>
<text x="1106" y="768" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Altitude-priority compensation</text>
<path d="M1079 695L1061 695" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="736" y="540" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="756" y="564" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="772" y="580" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">06  ATTITUDE / RATE</text>
<text x="758" y="617" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Body torque command</text>
<text x="758" y="652" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">τ* = −K_R e_R − K_ω e_ω</text>
<text x="758" y="681" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">       + ω × Jω</text>
<text x="758" y="710" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">K_R = [1.0, 1.0, 0.5]</text>
<text x="758" y="739" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">K_ω = [0.15, 0.15, 0.15]</text>
<text x="758" y="768" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Desired yaw rate from ω*ψ</text>
<text x="758" y="797" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Fixed gains; randomization off</text>
<path d="M731 695L713 695" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="388" y="540" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="408" y="564" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="424" y="580" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">07  ALLOCATION</text>
<text x="410" y="617" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Wrench → 4 motors</text>
<text x="410" y="652" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">w* = [0, 0, T, τx, τy, τz]</text>
<text x="410" y="681" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">220 mm motor diagonal</text>
<text x="410" y="710" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">9.6 N max per motor</text>
<text x="410" y="739" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Fixed allocation matrix</text>
<text x="410" y="768" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">ref5in candidate values</text>
<path d="M383 695L365 695" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="540" width="316" height="310" rx="16" fill="white" stroke="#DCE5EA"/>
<rect x="60" y="564" width="4" height="20" rx="2" fill="#007F73" stroke="#007F73"/>
<text x="76" y="580" font-size="12" font-weight="700" fill="#007F73" text-anchor="start">08  PLANT</text>
<text x="62" y="617" font-size="22" font-weight="700" fill="#142D3B" text-anchor="start">Rigid-body dynamics</text>
<text x="62" y="652" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">τ_motor = 0.04 s</text>
<text x="62" y="681" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">100 Hz physics</text>
<text x="62" y="710" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">10 physics steps / policy action</text>
<text x="62" y="739" font-size="16" font-weight="400" fill="#536B7A" text-anchor="start">Mass · inertia · contact</text>
<path d="M1242 480L1242 529" stroke="#8395A1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M198 862V903H1242V862" stroke="#8395A1" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/>
<text x="720" y="933" font-size="16" font-weight="400" fill="#536B7A" text-anchor="middle">STATE FEEDBACK · position / world velocity / attitude / body angular velocity</text>
<path d="M40 959L1400 959" stroke="#DCE5EA" stroke-width="2" fill="none"/>
<text x="40" y="987" font-size="14" font-weight="400" fill="#536B7A" text-anchor="start">초록색: 학습 정책 출력  /  흰색: 고정된 task·controller·vehicle 계약  /  actor의 z 출력은 1 m altitude PI가 덮어씀</text>
</g></svg>
<!-- ORIGINAL_PANEL_END -->
<rect y="1010" width="1440" height="150" fill="#e4f1ee"/><g font-family="Arial, Noto Sans CJK KR, sans-serif"><text x="40" y="1049" font-size="20" fill="#007f73" font-weight="700">SIMULATION / 구현 계약 · 2026-09-10</text><text x="40" y="1088" font-size="18" fill="#526775">학습 정책과 고정 제어기를 구분한 그림입니다.</text><text x="40" y="1117" font-size="18" fill="#526775">P10은 시뮬레이터 평가 결과입니다.</text></g></svg>

<rect x="1040" y="202" width="508" height="557" rx="20" fill="white" stroke="#dce5ea"/>
<text x="1067" y="250" font-size="27" fill="#007f73" font-weight="700" text-anchor="start">발표에서 강조할 범위</text>
<text x="1067" y="318" font-size="24" fill="#526775" font-weight="400" text-anchor="start">학습 정책과 고정 제어기를 구분한</text>
<text x="1067" y="357" font-size="24" fill="#526775" font-weight="400" text-anchor="start">그림입니다.</text>
<text x="1067" y="426" font-size="24" fill="#526775" font-weight="400" text-anchor="start">P10은 시뮬레이터 평가 결과입니다.</text>
<text x="1067" y="495" font-size="24" fill="#526775" font-weight="400" text-anchor="start">실제 비행 및 전이 성능은 미검증입니다.</text>
<path d="M52 804H1548" stroke="#cbd8df"/>
<text x="52" y="839" font-size="20" fill="#a55316" font-weight="400" text-anchor="start">원본 구조 및 실험 수치는 유지 · 추가된 설명은 검증 범위와 현재 상태를 구분합니다.</text>
<text x="52" y="875" font-size="16" fill="#526775" font-weight="400" text-anchor="start">근거: README.md 해당 파트 및 연결된 결과 보고서 / 원본: motar-control-stack.svg</text>
</g></svg>
