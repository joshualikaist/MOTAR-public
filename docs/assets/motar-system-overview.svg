<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">연구의 세 축 — 무엇을 측정했고, 어디까지 확인했는가</title><desc id="desc">시뮬레이션 진단 · 실영상 인지 · 공개 데이터 거리 측정은 서로 다른 검증 범위입니다.</desc><rect width="1600" height="900" fill="#f4f7fa"/><g font-family="Arial, Noto Sans CJK KR, sans-serif">
<text x="52" y="48" font-size="17" fill="#007f73" font-weight="700" text-anchor="start">MOTAR / RESEARCH EVIDENCE</text>
<text x="1548" y="48" font-size="16" fill="#526775" font-weight="700" text-anchor="end">2026-09-10 · EVIDENCE MAP</text>
<text x="52" y="108" font-size="39" fill="#142d3b" font-weight="700" text-anchor="start">연구의 세 축 — 무엇을 측정했고, 어디까지 확인했는가</text>
<text x="52" y="153" font-size="22" fill="#526775" font-weight="400" text-anchor="start">시뮬레이션 진단 · 실영상 인지 · 공개 데이터 거리 측정은 서로 다른 검증 범위입니다.</text>
<rect x="52" y="204" width="482" height="335" rx="20" fill="white" stroke="#dce5ea"/>
<text x="78" y="246" font-size="17" fill="#007f73" font-weight="700" text-anchor="start">TRACK A / SIMULATION</text>
<text x="78" y="292" font-size="29" fill="#142d3b" font-weight="700" text-anchor="start">안전필터 진단</text>
<text x="78" y="343" font-size="22" fill="#526775" font-weight="400" text-anchor="start">실험 계약과 실패 모드를 비교</text>
<text x="78" y="382" font-size="22" fill="#526775" font-weight="400" text-anchor="start">학습 시드 반복 검증 완료</text>
<text x="78" y="421" font-size="22" fill="#526775" font-weight="400" text-anchor="start">공동적응 주장은 철회</text>
<text x="78" y="460" font-size="22" fill="#526775" font-weight="400" text-anchor="start">실기 안전성을 입증한 것은 아님</text>
<rect x="559" y="204" width="482" height="335" rx="20" fill="white" stroke="#dce5ea"/>
<text x="585" y="246" font-size="17" fill="#007f73" font-weight="700" text-anchor="start">TRACK B / REAL-IMAGERY SOFTWARE</text>
<text x="585" y="292" font-size="29" fill="#142d3b" font-weight="700" text-anchor="start">인지 파이프라인</text>
<text x="585" y="343" font-size="22" fill="#526775" font-weight="400" text-anchor="start">검출 · 시간 모델 · 스트리밍</text>
<text x="585" y="382" font-size="22" fill="#526775" font-weight="400" text-anchor="start">P8–P10 오차 측정 및 시뮬 평가</text>
<text x="585" y="421" font-size="22" fill="#526775" font-weight="400" text-anchor="start">최종 selector test 평가 완료</text>
<text x="585" y="460" font-size="22" fill="#526775" font-weight="400" text-anchor="start">실영상 → 실기 정책 검증은 아님</text>
<rect x="1066" y="204" width="482" height="335" rx="20" fill="white" stroke="#dce5ea"/>
