params:
  seed: 42
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  load_checkpoint: False

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      # obs = 12 (goal-frame + body-heading state) + 36*4 (lidar) = 156. MLP feature extractor for the
      # Phase 1 skeleton; a CNN over the 36x4 scan (NavRL-style) can replace this later.
      units: [256, 256, 128]
      d2rl: False
      activation: elu
      initializer:
        name: default
        scale: 2

  config:
    env_name: navrl_task
    env_config:
      num_envs: 512
    name: gen_ppo
    reward_shaper:
      scale_value: 0.1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True
    learning_rate: 3e-4
    lr_schedule: adaptive
    kl_threshold: 0.016
    save_best_after: 20
    save_frequency: 50
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    clip_value: False
    num_actors: 512
    horizon_length: 32
    minibatch_size: 4096
    mini_epochs: 4
    critic_coef: 2
    normalize_input: True
    bounds_loss_coef: 0.0001
    max_epochs: 6000
    normalize_value: True
    use_diagnostics: True
    value_bootstrap: True
    use_smooth_clamp: False

    player:
      render: False
      deterministic: True
      games_num: 100
